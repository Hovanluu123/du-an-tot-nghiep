<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Auth Tester</title>
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#22d3ee; --card:#111827; --btn:#1f2937; }
    * { box-sizing: border-box }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; background:#0b1220; color:var(--fg); }
    .wrap { max-width: 980px; margin: 32px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 20px; font-weight: 700; }
    .grid { display:grid; grid-template-columns: repeat(12,1fr); gap:16px; }
    .card { grid-column: span 12; background: var(--card); border:1px solid #1f2937; border-radius: 12px; padding:16px; }
    label { display:block; font-size:12px; color: var(--muted); margin-bottom:6px; }
    input, select { width:100%; background:#0b1020; color:var(--fg); border:1px solid #293249; padding:10px 12px; border-radius:8px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #22d3ee22; }
    .row { display:grid; grid-template-columns: repeat(12,1fr); gap:12px; }
    .col-6 { grid-column: span 6; }
    .col-12 { grid-column: span 12; }
    .actions { display:flex; flex-wrap: wrap; gap:8px; margin-top:12px; }
    button { background: var(--btn); color: var(--fg); border:1px solid #2b3347; padding:10px 14px; border-radius: 8px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; background:#0a0f1c; color:#cbd5e1; border:1px solid #1e293b; border-radius:10px; padding:12px; min-height:200px; white-space: pre-wrap; }
    .token { word-break: break-all; font-size: 12px; color:#a5b4fc; }
    .hint { color: var(--muted); font-size:12px; }
    .table-container { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1f2937; }
    th { background: #1f2937; color: var(--fg); font-weight: 600; font-size: 12px; }
    td { font-size: 12px; }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .status-processing { background: #dbeafe; color: #1e40af; }
    .amount { font-weight: 600; color: var(--accent); }
    .product-list { max-width: 200px; }
    .product-item { margin-bottom: 4px; padding: 4px; background: #0a0f1c; border-radius: 4px; font-size: 11px; }
  </style>
  <script>
    let accessToken = '';
    let base = 'http://localhost:8000';

    function setBaseUrl() {
      base = document.getElementById('base').value.trim();
      if (base.endsWith('/')) base = base.slice(0,-1);
      alert('Đã set Base URL: ' + base);
      log('Base URL set to: ' + (base || '(same origin)'));
    }

    function endpoint(path) { return (base ? base : '') + path; }

    function log(msg, data) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${msg}` + (data ? `\n${JSON.stringify(data, null, 2)}` : '') + "\n\n" + el.textContent;
    }

    async function request(method, url, body, useAuth = false) {
      const headers = { 'Content-Type': 'application/json' };
      if (useAuth && accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
      const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const text = await res.text();
      let json; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
      return { ok: res.ok, status: res.status, data: json };
    }

    async function onRegister() {
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || undefined,
        address: document.getElementById('address').value || undefined,
        password: document.getElementById('password').value,
        password_confirmation: document.getElementById('password_confirmation').value,
      };
      const r = await request('POST', endpoint('/api/register'), payload);
      alert(r.data.message);
      log('REGISTER ' + r.status, r.data);
    }

    async function onLogin() {
      const payload = {
        email: document.getElementById('login_email').value,
        password: document.getElementById('login_password').value,
      };
      const r = await request('POST', endpoint('/api/login'), payload);
      log('LOGIN ' + r.status, r.data);
      if (r.ok && r.data && r.data.data && r.data.data.access_token) {
        alert('Đăng nhập thành công');
        accessToken = r.data.data.access_token;
        document.getElementById('token').textContent = accessToken;
      }
    }

    async function onMe() {
      const r = await request('GET', endpoint('/api/me'), null, true);
      log('ME ' + r.status, r.data);
      alert(r.data.message);
    }

    async function onRefresh() {
      const r = await request('POST', endpoint('/api/refresh'), {}, true);
      log('REFRESH ' + r.status, r.data);
      alert(r.message);
      if (r.ok && r.data && r.data.data && r.data.data.access_token) {
        accessToken = r.data.data.access_token;
        document.getElementById('token').textContent = accessToken;
      }
    }

    async function onLogout() {
      const r = await request('POST', endpoint('/api/logout'), {}, true);
      log('LOGOUT ' + r.status, r.data);
      alert(r.message);
      accessToken = '';
      document.getElementById('token').textContent = '(none)';
    }

    async function onResend() {
      const payload = { email: document.getElementById('email').value };
      const r = await request('POST', endpoint('/api/email/resend'), payload);
      log('RESEND ' + r.status, r.data);
      alert(r.message);
    }

    async function onVerifyUrl() {
      const url = document.getElementById('verifyUrl').value.trim();
      if (!url) return log('VERIFY: thiếu URL');
      const r = await fetch(url);
      const text = await r.text();
      let data; try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      log('VERIFY ' + r.status, data);
      alert(r.message);
    }

    async function onCreateOrder() {
      const items = [];
      const itemCount = parseInt(document.getElementById('itemCount').value) || 1;

      for (let i = 1; i <= itemCount; i++) {
        const productId = document.getElementById(`product_id_${i}`).value;
        const quantity = document.getElementById(`quantity_${i}`).value;

        if (productId && quantity) {
          items.push({
            product_id: parseInt(productId),
            quantity: parseInt(quantity)
          });
        }
      }

      const payload = {
        items: items,
        payment_method: document.getElementById('payment_method').value,
        shipping_method: document.getElementById('shipping_method').value,
        transport_company: document.getElementById('transport_company').value || undefined,
      };

      const r = await request('POST', endpoint('/api/orders'), payload, true);
      log('CREATE ORDER ' + r.status, r.data);
      alert(r.data.message);

      if (r.ok && r.data.data && r.data.data.vnpay_url) {
        document.getElementById('vnpayUrl').value = r.data.data.vnpay_url;
        log('VNPAY URL: ' + r.data.data.vnpay_url);
      }
    }

    async function onGetOrders() {
      const r = await request('GET', endpoint('/api/orders'), null, true);
      log('GET ORDERS ' + r.status, r.data);

      if (r.ok && r.data.data) {
        // Debug: log cấu trúc dữ liệu
        console.log('Response structure:', r.data);

        // Laravel pagination trả về object với thuộc tính 'data'
        let orders;
        if (r.data.data.data) {
          // Pagination object
          orders = r.data.data.data;
        } else if (Array.isArray(r.data.data)) {
          // Direct array
          orders = r.data.data;
        } else {
          // Single object
          orders = [r.data.data];
        }

        displayOrdersTable(orders);
      } else {
        alert(r.data.message || 'Có lỗi xảy ra');
      }
    }

    async function onGetOrder() {
      const orderId = document.getElementById('orderId').value;
      if (!orderId) return alert('Nhập Order ID');

      const r = await request('GET', endpoint(`/api/orders/${orderId}`), null, true);
      log('GET ORDER ' + r.status, r.data);

      if (r.ok && r.data.data) {
        displayOrderDetail(r.data.data);
      } else {
        alert(r.data.message || 'Có lỗi xảy ra');
      }
    }

    async function updateOrderStatus(orderId, status) {
      const r = await request('PATCH', endpoint(`/api/orders/${orderId}/status`), { status }, true);
      log('UPDATE ORDER STATUS ' + r.status, r.data);

      if (r.ok) {
        alert('Cập nhật trạng thái thành công');
        onGetOrders(); // Refresh danh sách
        onGetOrder(); // Refresh chi tiết
      } else {
        alert(r.data.message || 'Có lỗi xảy ra');
      }
    }

    async function updatePaymentStatus(paymentId, status) {
      const r = await request('PATCH', endpoint(`/api/payments/${paymentId}/status`), { status }, true);
      log('UPDATE PAYMENT STATUS ' + r.status, r.data);

      if (r.ok) {
        alert('Cập nhật trạng thái thanh toán thành công');
        onGetOrder(); // Refresh chi tiết đơn hàng
      } else {
        alert(r.data.message || 'Có lỗi xảy ra');
      }
    }

    function displayOrdersTable(orders) {
      const container = document.getElementById('ordersTable');
      if (!container) return;

      // Kiểm tra nếu orders không phải là array
      if (!orders || !Array.isArray(orders) || orders.length === 0) {
        container.innerHTML = '<div class="hint">Chưa có đơn hàng nào</div>';
        return;
      }

      let html = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Tổng tiền</th>
                <th>Trạng thái đơn hàng</th>
                <th>Trạng thái thanh toán</th>
                <th>Phương thức thanh toán</th>
                <th>Vận chuyển</th>
                <th>Ngày tạo</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody>
      `;

      orders.forEach(order => {
        const statusClass = getStatusClass(order.status);
        const createdAt = new Date(order.created_at).toLocaleString('vi-VN');

        const paymentStatus = order.payments?.[0]?.status || 'pending';
        const paymentStatusClass = getStatusClass(paymentStatus);

        html += `
          <tr>
            <td>#${order.id}</td>
            <td class="amount">${formatCurrency(order.total_amount)}</td>
            <td>
              <select onchange="updateOrderStatus(${order.id}, this.value)" style="padding: 4px 6px; font-size: 11px; background: #0b1020; color: var(--fg); border: 1px solid #293249; border-radius: 4px; min-width: 120px;">
                <option value="${order.status}" selected>${getStatusText(order.status)}</option>
                <option value="pending">Chờ xử lý</option>
                <option value="processing">Đang xử lý</option>
                <option value="completed">Hoàn thành</option>
                <option value="failed">Thất bại</option>
              </select>
            </td>
            <td>
              ${order.payments && order.payments.length > 0 ? `
                <select onchange="updatePaymentStatus(${order.payments[0].id}, this.value)" style="padding: 4px 6px; font-size: 11px; background: #0b1020; color: var(--fg); border: 1px solid #293249; border-radius: 4px; min-width: 120px;">
                  <option value="${paymentStatus}" selected>${getStatusText(paymentStatus)}</option>
                  <option value="pending">Chờ xử lý</option>
                  <option value="processing">Đang xử lý</option>
                  <option value="completed">Hoàn thành</option>
                  <option value="failed">Thất bại</option>
                </select>
              ` : '<span class="hint">Chưa có</span>'}
            </td>
            <td>${getPaymentMethodText(order.payments?.[0]?.method)}</td>
            <td>${order.shipping_method || 'N/A'}</td>
            <td>${createdAt}</td>
            <td>
              <button onclick="viewOrderDetail(${order.id})" style="padding: 4px 8px; font-size: 11px;">Xem chi tiết</button>
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    function displayOrderDetail(order) {
      const container = document.getElementById('orderDetail');
      if (!container) return;

      const statusClass = getStatusClass(order.status);
      const createdAt = new Date(order.created_at).toLocaleString('vi-VN');

      let productsHtml = '';
      if (order.order_items && order.order_items.length > 0) {
        order.order_items.forEach(item => {
          productsHtml += `
            <div class="product-item">
              <strong>${item.product?.name || 'Sản phẩm #' + item.product_id}</strong><br>
              Số lượng: ${item.quantity} | Giá: ${formatCurrency(item.price)}
            </div>
          `;
        });
      }

      let paymentsHtml = '';
      if (order.payments && order.payments.length > 0) {
        order.payments.forEach((payment, index) => {
          paymentsHtml += `
            <div class="product-item" style="margin-bottom: 12px; padding: 8px; background: #0a0f1c; border-radius: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <strong>${getPaymentMethodText(payment.method)}</strong>
                <span style="font-size: 11px; color: var(--muted);">#${payment.id}</span>
              </div>
              <div style="margin-bottom: 6px;">
                <strong>Số tiền:</strong> ${formatCurrency(payment.amount)}
              </div>
              <div style="margin-bottom: 6px;">
                <strong style="margin-bottom: 6px;">Trạng thái:</strong>
                <select onchange="updatePaymentStatus(${payment.id}, this.value)" style="padding: 4px 6px; font-size: 11px; background: #0b1020; color: var(--fg); border: 1px solid #293249; border-radius: 4px; margin-left: 6px; min-width: 120px;">
                  <option value="${payment.status}" selected>${getStatusText(payment.status)}</option>
                  <option value="pending">Chờ xử lý</option>
                  <option value="processing">Đang xử lý</option>
                  <option value="completed">Hoàn thành</option>
                  <option value="failed">Thất bại</option>
                </select>
              </div>
              ${payment.transaction_id ? `<div style="font-size: 11px; color: var(--muted);"><strong>Mã GD:</strong> ${payment.transaction_id}</div>` : ''}
            </div>
          `;
        });
      }

      const html = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th colspan="2">Chi tiết đơn hàng #${order.id}</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>Tổng tiền</strong></td>
                <td class="amount">${formatCurrency(order.total_amount)}</td>
              </tr>
              <tr>
                <td><strong>Trạng thái đơn hàng</strong></td>
                <td>
                  <select onchange="updateOrderStatus(${order.id}, this.value)" style="padding: 6px 8px; font-size: 12px; background: #0b1020; color: var(--fg); border: 1px solid #293249; border-radius: 4px; min-width: 150px;">
                    <option value="${order.status}" selected>${getStatusText(order.status)}</option>
                    <option value="pending">Chờ xử lý</option>
                    <option value="processing">Đang xử lý</option>
                    <option value="completed">Hoàn thành</option>
                    <option value="failed">Thất bại</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td><strong>Phương thức vận chuyển</strong></td>
                <td>${order.shipping_method || 'N/A'}</td>
              </tr>
              <tr>
                <td><strong>Công ty vận chuyển</strong></td>
                <td>${order.transport_company || 'N/A'}</td>
              </tr>
              <tr>
                <td><strong>Ngày tạo</strong></td>
                <td>${createdAt}</td>
              </tr>
              <tr>
                <td><strong>Sản phẩm</strong></td>
                <td class="product-list">${productsHtml || 'Không có sản phẩm'}</td>
              </tr>
              <tr>
                <td><strong>Thanh toán</strong></td>
                <td class="product-list">${paymentsHtml || 'Chưa có thông tin thanh toán'}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    function viewOrderDetail(orderId) {
      document.getElementById('orderId').value = orderId;
      onGetOrder();
    }

    function getStatusClass(status) {
      switch(status) {
        case 'pending': return 'status-pending';
        case 'completed': return 'status-completed';
        case 'failed': return 'status-failed';
        case 'processing': return 'status-processing';
        default: return 'status-pending';
      }
    }

    function getStatusText(status) {
      switch(status) {
        case 'pending': return 'Chờ xử lý';
        case 'completed': return 'Hoàn thành';
        case 'failed': return 'Thất bại';
        case 'processing': return 'Đang xử lý';
        default: return status;
      }
    }

    function getPaymentMethodText(method) {
      switch(method) {
        case 'cod': return 'COD';
        case 'vnpaytest': return 'VNPAY Test';
        default: return method || 'N/A';
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
      }).format(amount);
    }

    function addOrderItem() {
      const count = parseInt(document.getElementById('itemCount').value) || 1;
      const newCount = count + 1;
      document.getElementById('itemCount').value = newCount;

      const container = document.getElementById('orderItems');
      const newItem = document.createElement('div');
      newItem.className = 'row';
      newItem.innerHTML = `
        <div class="col-6">
          <label>Sản phẩm ID ${newCount}</label>
          <input id="product_id_${newCount}" placeholder="1" />
        </div>
        <div class="col-6">
          <label>Số lượng ${newCount}</label>
          <input id="quantity_${newCount}" placeholder="2" />
        </div>
      `;
      container.appendChild(newItem);
    }

    function removeOrderItem() {
      const count = parseInt(document.getElementById('itemCount').value) || 1;
      if (count <= 1) return;

      const container = document.getElementById('orderItems');
      const lastItem = container.lastElementChild;
      if (lastItem) {
        container.removeChild(lastItem);
        document.getElementById('itemCount').value = count - 1;
      }
    }
  </script>
  </head>
  <body>
    <div class="wrap">
      <h1>Auth API Tester</h1>
      <div class="card">
        <div class="row">
          <div class="col-12">
            <label>Base URL (để trống nếu cùng domain)</label>
            <div style="display:flex; gap:8px;">
              <input id="base" placeholder="http://localhost:8000" value="http://localhost:8000" />
              <button onclick="setBaseUrl()">Set</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 style="margin:0 0 12px; font-size:16px;">Đăng ký</h2>
        <div class="row">
          <div class="col-6">
            <label>Họ tên</label>
            <input id="name" placeholder="Nguyễn Văn A" />
          </div>
          <div class="col-6">
            <label>Số điện thoại</label>
            <input id="phone" placeholder="0900000000" />
          </div>
          <div class="col-6">
            <label>Email</label>
            <input id="email" placeholder="a@example.com" />
          </div>
          <div class="col-6">
            <label>Mật khẩu</label>
            <input id="password" type="password" placeholder="secret123" />
          </div>
          <div class="col-6">
            <label>Nhập lại mật khẩu</label>
            <input id="password_confirmation" type="password" placeholder="secret123" />
          </div>
          <div class="col-12">
            <label>Địa chỉ</label>
            <input id="address" placeholder="123 Đường ABC" />
          </div>
        </div>
        <div class="actions">
          <button onclick="onRegister()">Đăng ký</button>
          <button onclick="onResend()">Gửi lại email xác thực</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 style="margin:0 0 12px; font-size:16px;">Đăng nhập</h2>
        <div class="row">
          <div class="col-6">
            <label>Email</label>
            <input id="login_email" placeholder="a@example.com" />
          </div>
          <div class="col-6">
            <label>Mật khẩu</label>
            <input id="login_password" type="password" placeholder="secret123" />
          </div>
        </div>
        <div class="actions">
          <button onclick="onLogin()">Đăng nhập</button>
          <button onclick="onMe()">Me</button>
          <button onclick="onRefresh()">Refresh</button>
          <button onclick="onLogout()">Đăng xuất</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <label>Access Token hiện tại</label>
        <div class="token" id="token">(none)</div>
      </div>

      <div class="card" style="margin-top:16px;">
        <label>Verify URL (dán link xác thực từ email)</label>
        <div style="display:flex; gap:8px;">
          <input id="verifyUrl" placeholder="http://localhost/api/email/verify/{id}/{hash}?expires=...&signature=..." />
          <button onclick="onVerifyUrl()">Xác thực</button>
        </div>
        <div class="hint" style="margin-top:6px;">Không cần token, chỉ cần đúng link (signed).</div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 style="margin:0 0 12px; font-size:16px;">Tạo đơn hàng</h2>
        <div class="row">
          <div class="col-6">
            <label>Phương thức thanh toán</label>
            <select id="payment_method">
              <option value="cod">COD (Thanh toán khi nhận hàng)</option>
              <option value="vnpaytest">VNPAY Test</option>
            </select>
          </div>
          <div class="col-6">
            <label>Phương thức vận chuyển</label>
            <input id="shipping_method" placeholder="Giao hàng nhanh" />
          </div>
          <div class="col-12">
            <label>Công ty vận chuyển</label>
            <input id="transport_company" placeholder="Viettel Post" />
          </div>
        </div>

        <div style="margin:12px 0;">
          <label>Sản phẩm trong đơn hàng</label>
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <button onclick="addOrderItem()">+ Thêm sản phẩm</button>
            <button onclick="removeOrderItem()">- Xóa sản phẩm</button>
          </div>
          <input type="hidden" id="itemCount" value="1" />
          <div id="orderItems">
            <div class="row">
              <div class="col-6">
                <label>Sản phẩm ID 1</label>
                <input id="product_id_1" placeholder="1" />
              </div>
              <div class="col-6">
                <label>Số lượng 1</label>
                <input id="quantity_1" placeholder="2" />
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button onclick="onCreateOrder()">Tạo đơn hàng</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 style="margin:0 0 12px; font-size:16px;">Quản lý đơn hàng</h2>
        <div class="row">
          <div class="col-6">
            <label>Order ID (để xem chi tiết)</label>
            <input id="orderId" placeholder="1" />
          </div>
        </div>
        <div class="actions">
          <button onclick="onGetOrders()">Lấy danh sách đơn hàng</button>
          <button onclick="onGetOrder()">Xem chi tiết đơn hàng</button>
        </div>

        <div id="ordersTable" style="margin-top: 16px;"></div>
        <div id="orderDetail" style="margin-top: 16px;"></div>
      </div>

      <div class="card" style="margin-top:16px;">
        <label>VNPAY URL (sẽ được điền tự động khi tạo đơn hàng VNPAY)</label>
        <div style="display:flex; gap:8px;">
          <input id="vnpayUrl" placeholder="URL thanh toán VNPAY sẽ hiện ở đây..." readonly />
          <button onclick="if(document.getElementById('vnpayUrl').value) window.open(document.getElementById('vnpayUrl').value, '_blank')">Mở VNPAY</button>
        </div>
        <div class="hint" style="margin-top:6px;">Click "Mở VNPAY" để test thanh toán. Sau khi thanh toán thành công, VNPAY sẽ redirect về callback URL.</div>
      </div>

      <div class="card" style="margin-top:16px;">
        <label>Logs</label>
        <div id="log" class="log"></div>
      </div>
    </div>
  </body>
</html>
